
name: Build Starl Music APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 8.9
        run: |
          set -e
          curl -fL --retry 10 --retry-all-errors \
            --retry-delay 5 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o gradle.zip

          unzip -q gradle.zip
          ./gradle-8.9/bin/gradle --version

      - name: Build Starl APK
        run: ./gradle-8.9/bin/gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Starl-Music-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
