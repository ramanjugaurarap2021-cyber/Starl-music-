
name: Build Starl Music APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Starl Project
        run: |
          mkdir -p project
          unzip -q StarlMusic-HUAWEI-MIRROR-FIX.zip -d project

          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -100

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" \
            -name settings.gradle.kts \
            -printf '%h\n' | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" \
              -name settings.gradle \
              -printf '%h\n' | head -1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          curl -fL --retry 5 --retry-all-errors \
            https://mirrors.huaweicloud.com/gradle/gradle-8.9-bin.zip \
            -o gradle.zip
          unzip -q gradle.zip

      - name: Build Starl
        run: |
          cd "$PROJECT_DIR"
          "$GITHUB_WORKSPACE/gradle-8.9/bin/gradle" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Starl-Music-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
