
name: Build Starl Music APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 8 --retry-all-errors \
            --retry-delay 10 \
            https://downloads.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"

          curl -fL --retry 8 --retry-all-errors \
            https://downloads.gradle.org/distributions/gradle-8.9-bin.zip.sha256 \
            -o "$RUNNER_TEMP/gradle.zip.sha256"

          echo "$(cat "$RUNNER_TEMP/gradle.zip.sha256")  $RUNNER_TEMP/gradle.zip" | sha256sum -c -

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

      - name: Build Starl APK
        run: |
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" \
            --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Starl-Music-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
